purchase_price:
  min: 80000
  max: 150000
  comment: Gesamter Kaufpreis inkl. aller Nebenkosten
built_year:
  min: 0
  comment: Bevorzugt Baujahr 1990+, um GDR-/Vorkriegsbestand mit hohem Sanierungsrisiko
    zu meiden. Kein Mindest-Energieausweis (noch keine Praeferenz).
living_space:
  target_min: 35
  target_max: 50
  allowed_min: 30
  allowed_max: 55
  comment: Zielbereich 35-50m², mit Toleranz nach unten/oben bis 30/55m²
equity:
  min: 15000
  max: 40000
  comment: Verfügbares Eigenkapital für Anzahlung und Nebenkosten
financing:
  loan_to_value: 1.0
  comment: 100% Bankfinanzierung des Kaufpreises
loan:
  interest_rate: 0.048
  amortization_rate: 0.02
  total_rate: 0.068
  comment: Zins 4.8%, Tilgung 2%, zusammen 6.8% p.a. auf den Kreditbetrag
purchase_costs:
  berlin: 0.06
  brandenburg: 0.065
  brandenburg_berlin_belt: 0.065
  saxony: 0.055
  saxony_anhalt: 0.05
  other: 0.06
  comment: Grunderwerbsteuer + Notar; Makler separat. Berlin 6%, Brandenburg 6.5%
renovation:
  budget: 15000
  comment: Pauschales Sanierungsbudget; kann pro Listing überschrieben werden
